<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tick tok profile</title>
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css'>

  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="">

  <nav>
    <div class="item">
      <i class="bi bi-chevron-left"></i>
    </div>
    <div class="motto">Your tech parthner</div>
    <div class="item">
      <i class="bi bi-three-dots"></i>
    </div>

  </nav>
  <main>

    <div class="profile">

      <div class="profile_image">
        <img src="./assets/img/boolean_logo.png" alt="">
      </div>
      <!-- /.profile_image -->

      <div class="profile_handler">@boolean dancer</div>
      <!-- /.profile_handler -->

      <div class="stats">
        <div class="item">
          <strong>525</strong>
          <div>Following</div>
        </div>
        <!-- /.item -->
        <div class="item">
          <strong>24.9K</strong>
          <div>Followers</div>
        </div>
        <!-- /.item -->
        <div class="item">
          <strong>1.3M</strong>
          <div>Linkes</div>
        </div>
        <!-- /.item -->
      </div>
      <!-- /.stats -->

      <div class="actions">
        <div class="wide">
          <button class="btn btn-primary">Follow</button>
        </div>
        <div class="">
          <button class="btn btn-outline">
            <i class="bi bi-instagram"></i>
          </button>
        </div>
        <div class="">
          <button class="btn btn-outline">
            <i class="bi bi-caret-down-fill"></i>
          </button>
        </div>
      </div>
      <!-- /.actions -->

      <div class="profile_description">
        💻Lorem ipsum dolor sit, amet consectetur <br> ⬇️Accusamus quae assumenda incidunt totam esse dolor <br>
        praesentium. Dolore provident optio,🔥 <br> molestias dignissimos accusamus nemo, <br> harum nihil in neque,
        commodi iusto
        iure!
      </div>

    </div>
    <!-- /.profile -->

    <div class="tabs">
      <div class="tab_buttons">
        <div>
          <button class="fist-child">
            <i class="bi bi-grid"></i>
          </button>
        </div>
        <div>
          <button>
            <i class="bi bi-heart"></i>
          </button>
        </div>
      </div>
      <div class="cards">
        <div class="card">
          <img src="./assets/img/thumb1.webp" alt="">
        </div>
        <div class="card">
          <img src="./assets/img/thumb2.webp" alt="">
        </div>
        <div class="card">
          <img src="./assets/img/thumb3.webp" alt="">
        </div>
        <div class="card">
          <img src="./assets/img/thumb4.png" alt="">
        </div>
        <div class="card">
          <img src="./assets/img/thumb5.png" alt="">
        </div>
        <div class="card">
          <img src="./assets/img/thumb6.png" alt="">
        </div>
      </div>
    </div>
    <!-- /.tabs -->


  </main>

</body>

</html>
